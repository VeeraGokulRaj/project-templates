services:
{% if cookiecutter.database == 'postgresql' %}
  db:
    image: postgres:16
    container_name: {{ cookiecutter.project_slug }}-postgres
    environment:
      POSTGRES_DB: {{ cookiecutter.project_slug }}
      POSTGRES_USER: {{ cookiecutter.project_slug }}
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
{% endif %}

  redis:
    image: redis:7-alpine
    container_name: {{ cookiecutter.project_slug }}-redis
    ports:
      - "6380:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: {{ cookiecutter.project_slug }}-web
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
{% if cookiecutter.database == 'postgresql' %}
      - db
{% endif %}
      - redis
    command: uv run python manage.py runserver 0.0.0.0:8000

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: {{ cookiecutter.project_slug }}-celery-worker
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
{% if cookiecutter.database == 'postgresql' %}
      - db
{% endif %}
    command: uv run celery -A config worker -l info

{% if cookiecutter.database == 'postgresql' %}
volumes:
  postgres_data:
{% endif %}
