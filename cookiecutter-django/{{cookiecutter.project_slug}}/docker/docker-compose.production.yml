services:
{% if cookiecutter.database == 'postgresql' %}
  db:
    restart: unless-stopped
    image: postgres:16
    container_name: {{ cookiecutter.project_slug }}-postgres
    environment:
      POSTGRES_DB: {{ cookiecutter.project_slug }}
      POSTGRES_USER: {{ cookiecutter.project_slug }}
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
{% endif %}

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: {{ cookiecutter.project_slug }}-redis
    ports:
      - "6380:6379"

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: {{ cookiecutter.project_slug }}-web
    env_file:
      - ../.env
    volumes:
      - static_data:/app/staticfiles
    depends_on:
{% if cookiecutter.database == 'postgresql' %}
      - db
{% endif %}
      - redis
    command: >
      sh -c "
      uv run python manage.py migrate &&
      uv run python manage.py collectstatic --noinput &&
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    container_name: {{ cookiecutter.project_slug }}-nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro

  celery-worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: {{ cookiecutter.project_slug }}-celery-worker
    env_file:
      - ../.env
    depends_on:
      - redis
{% if cookiecutter.database == 'postgresql' %}
      - db
{% endif %}
    command: uv run celery -A config worker -l info

volumes:
{% if cookiecutter.database == 'postgresql' %}
  postgres_data:
{% endif %}
  static_data:
