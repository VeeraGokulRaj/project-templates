[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.7",
    "django-browser-reload>=1.21.0",
    "django-environ>=0.14.0",
    "django-model-utils>=5.0.0",
    "django-redis>=7.0.0",
    "django-safedelete>=1.4.1",
    "django-simple-history>=3.12.0",
    "faker>=40.31.0",
    "gunicorn>=26.0.0",
    {% if cookiecutter.database == 'postgresql' %}"psycopg[binary]>=3.3.4",{% endif %}
    {% if cookiecutter.use_sentry == 'y' %}"sentry-sdk>=2.66.1",{% endif %}
    "user-agents>=2.2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["."]
addopts = ["--reuse-db"]

[dependency-groups]
dev = [
    "coverage>=7.15.1",
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=7.0.0",
    "django-extensions>=4.1",
    "ipython>=9.15.0",
    {% if cookiecutter.use_precommit == 'y' %}"pre-commit>=4.6.0",{% endif %}
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.21",
]
